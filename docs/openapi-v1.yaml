openapi: 3.0.3
info:
  title: Libok Kernel API
  version: 0.1.0
  description: JSON API for the libok kernel. Browser clients authenticate with HttpOnly cookies.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
  schemas:
    Envelope:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        data: {}
        message:
          type: string
    Error:
      type: object
      required: [success, message, code]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        code:
          type: string
    Pagination:
      type: object
      required: [total, page, per_page, total_pages]
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        total_pages:
          type: integer
    User:
      type: object
      required: [id, name, email, status, roles, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
        roles:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
paths:
  /health/live:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
  /health/ready:
    get:
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Dependencies are ready
        "503":
          description: Database or storage is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/register:
    post:
      summary: Register a member
      security: []
      responses:
        "201":
          description: Created
        "409":
          description: Email already exists
  /auth/login:
    post:
      summary: Login and set HttpOnly cookies
      security: []
      responses:
        "200":
          description: Session started
        "401":
          description: Invalid credentials
        "429":
          description: Rate limited
  /auth/refresh:
    post:
      summary: Rotate refresh cookie and issue a new access cookie
      security: []
      responses:
        "200":
          description: Session refreshed
        "401":
          description: Refresh token missing or revoked
  /auth/logout:
    post:
      summary: Revoke refresh token and clear cookies
      security: []
      responses:
        "200":
          description: Logged out
  /me:
    get:
      summary: Current authenticated user
      responses:
        "200":
          description: Profile
        "401":
          description: Missing or expired access cookie
  /secure/ping:
    get:
      summary: Authenticated ping
      responses:
        "200":
          description: OK
        "401":
          description: Missing or expired access cookie
  /uploads:
    post:
      summary: Store an uploaded file
      responses:
        "201":
          description: Stored
        "401":
          description: Authentication required
        "422":
          description: Rejected path or MIME type
  /users:
    get:
      summary: List users
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: sort
          in: query
          schema:
            type: string
            default: created_at:desc
      responses:
        "200":
          description: Paginated users
        "401":
          description: Authentication required
        "403":
          description: Operator role required
    post:
      summary: Create a user
      responses:
        "201":
          description: Created
        "403":
          description: Operator role required
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a user
      responses:
        "200":
          description: User
        "404":
          description: Not found
    patch:
      summary: Update a user
      responses:
        "200":
          description: Updated
        "404":
          description: Not found
    delete:
      summary: Delete a user
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
